# À placer dans le dépôt GitHub sous : .github/workflows/weekly.yml
name: Rapport hebdomadaire
on:
  schedule:
    - cron: "0 12 * * 1"   # chaque lundi, 12 h UTC
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py --weeks 52
      - name: Publier le site public (dossier docs/)
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "Mise à jour hebdomadaire" || echo "rien à publier"
          git push
      - name: Rapports payants (à télécharger et envoyer aux abonnés)
        uses: actions/upload-artifact@v4
        with:
          name: rapports-premium
          path: premium/
